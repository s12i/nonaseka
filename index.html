<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>ノナセカ</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎵</text></svg>" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <div id="vocalist" class="vocalist state-title" aria-hidden="true">
        <svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="hairGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff9ec7" />
              <stop offset="1" stop-color="#c79bff" />
            </linearGradient>
            <linearGradient id="outfitGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff6fa5" />
              <stop offset="1" stop-color="#a78bfa" />
            </linearGradient>
          </defs>

          <path d="M60,80 C30,90 20,140 35,195 C45,206 62,202 56,182 C66,150 65,110 60,80 Z" fill="url(#hairGrad)" />
          <path d="M140,80 C170,90 180,140 165,195 C155,206 138,202 144,182 C134,150 135,110 140,80 Z" fill="url(#hairGrad)" />
          <circle cx="100" cy="95" r="58" fill="url(#hairGrad)" />

          <path d="M40,192 C40,164 160,164 160,192 L160,220 L40,220 Z" fill="url(#outfitGrad)" />

          <circle cx="100" cy="100" r="48" fill="#ffe6d5" />
          <path d="M50,92 C58,54 142,54 150,92 C140,72 60,72 50,92 Z" fill="url(#hairGrad)" />

          <path d="M45,88 C45,38 155,38 155,88" stroke="#f4f0fa" stroke-width="11" fill="none" stroke-linecap="round" />
          <circle cx="45" cy="98" r="16" fill="#f4f0fa" stroke="#d8cfe8" stroke-width="2" />
          <circle cx="155" cy="98" r="16" fill="#f4f0fa" stroke="#d8cfe8" stroke-width="2" />
          <circle class="led-l" cx="45" cy="98" r="5" fill="#ff6fa5" />
          <circle class="led-r" cx="155" cy="98" r="5" fill="#4fc3f7" />

          <ellipse cx="68" cy="118" rx="10" ry="6" fill="#ff9ec7" opacity="0.35" />
          <ellipse cx="132" cy="118" rx="10" ry="6" fill="#ff9ec7" opacity="0.35" />

          <ellipse cx="82" cy="102" rx="7" ry="10" fill="#5b4a72" />
          <ellipse cx="118" cy="102" rx="7" ry="10" fill="#5b4a72" />
          <circle cx="84.5" cy="98" r="2.4" fill="#ffffff" />
          <circle cx="120.5" cy="98" r="2.4" fill="#ffffff" />

          <path class="mouth-closed" d="M92,128 Q100,133 108,128" stroke="#a5765f" stroke-width="3" fill="none" stroke-linecap="round" />
          <ellipse class="mouth-open" cx="100" cy="130" rx="7" ry="6" fill="#7a4a55" />

          <rect x="145" y="115" width="12" height="12" fill="#6ee7b7" stroke="#ffffff" stroke-width="2" transform="rotate(45 151 121)" />
        </svg>
        <div class="vocalist-name">Virtual Singer: ノナ</div>
      </div>

      <section id="title-screen" class="overlay">
        <h1 class="logo">ノナセカ</h1>
        <p class="tagline">タップで奏でる、ミニリズムゲーム</p>
        <button id="start-button" class="primary-button">START</button>
        <p class="hint">PC: <kbd>D</kbd> <kbd>F</kbd> <kbd>J</kbd> <kbd>K</kbd> キー &nbsp;/&nbsp; スマホ: レーンをタップ</p>
      </section>

      <section id="result-screen" class="overlay hidden">
        <h2 class="result-title">RESULT</h2>
        <div class="rank" id="result-rank">S</div>
        <div class="score" id="result-score">0</div>
        <table class="judge-table">
          <tbody>
            <tr><td class="j-perfect">PERFECT</td><td id="count-perfect">0</td></tr>
            <tr><td class="j-great">GREAT</td><td id="count-great">0</td></tr>
            <tr><td class="j-good">GOOD</td><td id="count-good">0</td></tr>
            <tr><td class="j-miss">MISS</td><td id="count-miss">0</td></tr>
            <tr><td>MAX COMBO</td><td id="result-combo">0</td></tr>
          </tbody>
        </table>
        <button id="retry-button" class="primary-button">もう一度あそぶ</button>
      </section>

      <div id="hud" class="hidden">
        <div id="hud-score">0</div>
        <div id="hud-combo"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
